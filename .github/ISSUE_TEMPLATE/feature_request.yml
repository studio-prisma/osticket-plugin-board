name: Feature request
description: Suggest a capability this plugin does not have yet
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to achieve that the board does not support today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      description: |
        The board is a view on osTicket's own data and permissions. It does not add
        its own tables, its own permission model, or write access for clients.
      options:
        - label: My request stays within that scope
          required: true
