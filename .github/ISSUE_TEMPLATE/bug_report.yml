name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do **not** paste ticket contents, customer names or e-mail addresses
        into this form. Redact hostnames if they are not public.

        If a client or agent can **see or change a ticket they should not**, this is a
        security issue: report it privately via the security link, not here.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Log in as an agent with role ...
        2. Open Applications, then Board
        3. ...
    validations:
      required: true

  - type: input
    id: osticket-version
    attributes:
      label: osTicket version
      placeholder: "1.18.4"
    validations:
      required: true

  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: "8.3.33"
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Agent board
        - Client board
        - Portal navigation entry
        - Drag and drop or status change
        - Plugin configuration
        - Layout or theme
        - Other or unclear
    validations:
      required: true

  - type: input
    id: server
    attributes:
      label: Web server
      placeholder: "Apache 2.4 or Nginx 1.26"

  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: PHP error log and browser console. Redact IPs and names.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I reproduced it after a hard reload (cached board.js and board.css ruled out)
          required: true
        - label: I have removed all customer data from this report
          required: true
